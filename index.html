<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Velutto Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --tg-bg: var(--tg-theme-bg-color, #0f0f0f);
      --tg-text: var(--tg-theme-text-color, #ffffff);
      --tg-hint: var(--tg-theme-hint-color, #8e8e93);
      --tg-button: var(--tg-theme-button-color, #f97316);
      --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
      --tg-secondary: var(--tg-theme-secondary-bg-color, #1c1c1e);
    }
    body {
      background: var(--tg-bg);
      color: var(--tg-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    * { transition: all 0.2s ease-in-out; }
    .btn-primary {
      background: var(--tg-button);
      color: var(--tg-button-text);
      border-radius: 8px;
      font-weight: 600;
    }
    .btn-primary:active { opacity: 0.85; }
    .bottom-sheet {
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .bottom-sheet.open { transform: translateY(0); }
    .checkmark { display: none; }
    .btn-success .btn-text { display: none; }
    .btn-success .checkmark { display: inline; }
    .skeleton {
      background: linear-gradient(90deg, #2a2a2a 25%, #3a3a3a 50%, #2a2a2a 75%);
      background-size: 200% 100%;
      animation: skeleton 1.4s ease infinite;
    }
    @keyframes skeleton {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    input, select {
      border: 1px solid #3a3a3a;
    }
    input:focus, select:focus {
      border-color: var(--tg-button);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="sticky top-0 z-40 px-4 py-3 flex items-center justify-between border-b" style="background: var(--tg-bg); border-color: #2a2a2a;">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center font-bold text-lg" style="background: var(--tg-button); color: var(--tg-button-text);">V</div>
      <div>
        <div class="font-semibold text-[17px] leading-tight">Velutto Studio</div>
        <div class="text-[11px]" style="color: var(--tg-hint);">Тихая роскошь</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleAdmin()" class="px-3 py-2 rounded-2xl text-sm" style="background: var(--tg-secondary);">Админ</button>
      <button onclick="showCart()" class="relative flex items-center gap-2 px-3.5 py-2 rounded-2xl text-sm" style="background: var(--tg-secondary);">
        🛒
        <span id="cart-count" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full text-[11px] font-bold flex items-center justify-center" style="background: var(--tg-button); color: var(--tg-button-text);">0</span>
      </button>
    </div>
  </header>

  <!-- Promo Banner (Главный баннер с текстом) -->
  <div class="px-4 pt-4">
    <div class="relative w-full aspect-[21/9] rounded-2xl overflow-hidden shadow-lg border" style="border-color: #2a2a2a; background: var(--tg-secondary);">
      <video src="https://assets.mixkit.co/videos/preview/mixkit-stylish-woman-walking-with-shopping-bags-41443-large.mp4" 
             autoplay muted loop playsinline class="w-full h-full object-cover">
      </video>
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent flex items-end p-3">
        <div>
          <div id="banner-tag" class="text-xs font-semibold text-orange-400 uppercase tracking-wider">Новая коллекция</div>
          <div id="banner-title" class="text-sm font-bold text-white">Весна-Лето 2026</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Search & Categories -->
  <div class="px-4 pt-4 space-y-3">
    <input id="search" type="text" placeholder="Поиск по коллекции..."
           class="w-full px-4 py-3 rounded-2xl text-sm outline-none"
           style="background: var(--tg-secondary); color: var(--tg-text); border: none;"
           oninput="filterProducts()">

    <div id="categories-container" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
      <button onclick="filterByCategory('Все')" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap" style="background: var(--tg-button); color: var(--tg-button-text);">Все</button>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="admin-panel" class="hidden px-4 pt-4">
    <div class="rounded-2xl p-4 mb-4 space-y-4" style="background: var(--tg-secondary);">
      
      <div id="admin-auth">
        <div class="font-semibold mb-3">Вход в панель управления</div>
        <input id="admin-pass-input" type="password" placeholder="Пароль" class="w-full mb-3 px-3 py-2.5 rounded-xl text-sm outline-none" style="background: var(--tg-bg); color: var(--tg-text);">
        <button onclick="checkAdminPass()" class="btn-primary w-full py-3 text-sm">Войти</button>
      </div>

      <div id="admin-content" class="hidden space-y-5">
        <div class="flex rounded-xl p-1 gap-1" style="background: var(--tg-bg);">
          <button onclick="switchAdminTab('products')" id="tab-prod-btn" class="flex-1 py-2 text-xs font-semibold rounded-lg" style="background: var(--tg-button); color: var(--tg-button-text);">Товары</button>
          <button onclick="switchAdminTab('banner')" id="tab-ban-btn" class="flex-1 py-2 text-xs font-semibold rounded-lg" style="color: var(--tg-hint);">Текст баннера</button>
          <button onclick="switchAdminTab('orders')" id="tab-ord-btn" class="flex-1 py-2 text-xs font-semibold rounded-lg" style="color: var(--tg-hint);">Заказы</button>
        </div>

        <!-- Вкладка 1: Товары -->
        <div id="admin-products-section" class="space-y-3">
          <div class="flex justify-between items-center">
            <div id="form-title" class="font-semibold text-sm">Добавить товар</div>
            <button id="cancel-edit-btn" onclick="resetForm()" class="text-xs hidden" style="color: #ef4444;">Отмена</button>
          </div>
          
          <input id="edit-product-id" type="hidden">
          <input id="admin-name" type="text" placeholder="Название" class="w-full px-3 py-2.5 rounded-xl text-sm outline-none" style="background: var(--tg-bg); color: var(--tg-text);">
          <input id="admin-price" type="number" placeholder="Цена (₸)" class="w-full px-3 py-2.5 rounded-xl text-sm outline-none" style="background: var(--tg-bg); color: var(--tg-text);">
          
          <div class="space-y-2">
            <div class="text-xs" style="color: var(--tg-hint);">Категория товара:</div>
            <select id="admin-category-select" onchange="onCategorySelectChange()" class="w-full px-3 py-2.5 rounded-xl text-sm outline-none" style="background: var(--tg-bg); color: var(--tg-text);">
              <option value="Платья">Платья</option>
              <option value="Костюмы">Костюмы</option>
              <option value="Верхняя одежда">Верхняя одежда</option>
              <option value="Аксессуары">Аксессуары</option>
              <option value="new">+ Создать новую категорию</option>
            </select>
            <input id="admin-category-custom" type="text" placeholder="Введите название новой категории" class="w-full px-3 py-2.5 rounded-xl text-sm outline-none hidden" style="background: var(--tg-bg); color: var(--tg-text);">
          </div>

          <input id="admin-sizes" type="text" placeholder="Размеры через запятую (S, M, L)" class="w-full px-3 py-2.5 rounded-xl text-sm outline-none" style="background: var(--tg-bg); color: var(--tg-text);">
          <input id="admin-colors" type="text" placeholder="Цвета через запятую (чёрный, белый)" class="w-full px-3 py-2.5 rounded-xl text-sm outline-none" style="background: var(--tg-bg); color: var(--tg-text);">
          
          <div class="space-y-1">
            <div class="text-xs" style="color: var(--tg-hint);">Загрузите до 3 фотографий товара:</div>
            <input type="file" id="admin-photos" accept="image/*" multiple class="w-full text-sm" style="border: none;">
          </div>

          <button id="save-btn" onclick="saveProduct()" class="btn-primary w-full py-3 text-sm">Опубликовать товар</button>
          <div id="admin-status" class="text-sm text-center" style="color: var(--tg-hint);"></div>
        </div>

        <!-- Вкладка 2: Редактирование текста баннера -->
        <div id="admin-banner-section" class="hidden space-y-3">
          <div class="font-semibold text-sm">Текст на главном баннере</div>
          <input id="admin-banner-tag" type="text" placeholder="Верхняя надпись (например: Новая коллекция)" class="w-full px-3 py-2.5 rounded-xl text-sm outline-none" style="background: var(--tg-bg); color: var(--tg-text);">
          <input id="admin-banner-title" type="text" placeholder="Основная надпись (например: Весна-Лето 2026)" class="w-full px-3 py-2.5 rounded-xl text-sm outline-none" style="background: var(--tg-bg); color: var(--tg-text);">
          <button onclick="saveBannerText()" class="btn-primary w-full py-3 text-sm">Сохранить текст баннера</button>
          <div id="banner-status" class="text-sm text-center" style="color: var(--tg-hint);"></div>
        </div>

        <!-- Вкладка 3: Заказы -->
        <div id="admin-orders-section" class="hidden space-y-3">
          <div class="font-semibold text-sm">Список заказов</div>
          <div id="admin-orders-list" class="space-y-3 max-h-96 overflow-y-auto"></div>
        </div>

      </div>

    </div>
  </div>

  <!-- Skeleton -->
  <div id="skeleton" class="p-4 grid grid-cols-2 gap-3 hidden">
    <div class="rounded-2xl overflow-hidden">
      <div class="skeleton aspect-square"></div>
      <div class="p-3 space-y-2">
        <div class="skeleton h-4 rounded w-3/4"></div>
        <div class="skeleton h-5 rounded w-1/2"></div>
      </div>
    </div>
    <div class="rounded-2xl overflow-hidden">
      <div class="skeleton aspect-square"></div>
      <div class="p-3 space-y-2">
        <div class="skeleton h-4 rounded w-3/4"></div>
        <div class="skeleton h-5 rounded w-1/2"></div>
      </div>
    </div>
  </div>

  <!-- Products Grid -->
  <div id="products-grid" class="p-4 grid grid-cols-2 gap-3"></div>

  <!-- Bottom Sheet -->
  <div id="sheet-overlay" class="fixed inset-0 bg-black/60 z-50 hidden" onclick="closeSheet()"></div>
  <div id="bottom-sheet" class="bottom-sheet fixed bottom-0 left-0 right-0 z-50 rounded-t-3xl p-5 max-h-[85vh] overflow-auto" style="background: var(--tg-bg);">
    <div class="w-10 h-1 rounded-full mx-auto mb-4" style="background: #3a3a3a;"></div>
    <div id="sheet-content"></div>
  </div>

  <!-- Cart -->
  <div id="cart-overlay" class="fixed inset-0 bg-black/60 z-50 hidden" onclick="hideCart()"></div>
  <div id="cart-sheet" class="bottom-sheet fixed bottom-0 left-0 right-0 z-50 rounded-t-3xl p-5 max-h-[85vh] overflow-auto" style="background: var(--tg-bg);">
    <div class="flex justify-between items-center mb-5">
      <div class="text-xl font-semibold">Корзина</div>
      <button onclick="hideCart()" class="text-3xl leading-none" style="color: var(--tg-hint);">×</button>
    </div>
    <div id="cart-items" class="space-y-3 mb-6"></div>
    
    <div class="border-t pt-4" style="border-color: #2a2a2a;">
      <div id="checkout-form" class="mb-5 space-y-3 hidden">
        <div class="text-sm font-semibold mb-2" style="color: var(--tg-hint);">Контактные данные</div>
        <input id="order-name" type="text" placeholder="Ваше имя" class="w-full px-3 py-3 rounded-xl text-sm outline-none" style="background: var(--tg-secondary); color: var(--tg-text);">
        <input id="order-phone" type="tel" placeholder="Номер телефона" class="w-full px-3 py-3 rounded-xl text-sm outline-none" style="background: var(--tg-secondary); color: var(--tg-text);">
      </div>

      <div class="flex justify-between text-lg font-semibold mb-4">
        <span>Итого</span>
        <span id="cart-total">0 ₸</span>
      </div>
      <button onclick="checkout()" class="btn-primary w-full py-4 text-base">Оформить заказ</button>
      <button onclick="writeToManager()" class="w-full mt-3 py-3.5 rounded-lg text-sm border" style="border-color: #3a3a3a; color: var(--tg-text);">
        Написать менеджеру
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zvzzbwfmjfjbffyclyws.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ufJvMq3VX9sq2_bDnsW1OQ_FSclYUap';
    const TELEGRAM_BOT_TOKEN = '8670786763:AAHpynq_52ECKUZZTgbEuhcdILbh90anltI'; 
    const ADMIN_CHAT_ID = '563657323';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ADMIN_PASSWORD = 'velutto2026';
    let isAdminLoggedIn = false;
    let products = [];
    let cart = [];
    let currentCategory = 'Все';
    let availableCategories = ['Платья', 'Костюмы', 'Верхняя одежда', 'Аксессуары'];

    if (window.Telegram?.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      document.documentElement.style.setProperty('--tg-bg', tg.themeParams.bg_color || '#0f0f0f');
      document.documentElement.style.setProperty('--tg-text', tg.themeParams.text_color || '#ffffff');
      document.documentElement.style.setProperty('--tg-hint', tg.themeParams.hint_color || '#8e8e93');
      document.documentElement.style.setProperty('--tg-button', tg.themeParams.button_color || '#f97316');
      document.documentElement.style.setProperty('--tg-button-text', tg.themeParams.button_text_color || '#ffffff');
      document.documentElement.style.setProperty('--tg-secondary', tg.themeParams.secondary_bg_color || '#1c1c1e');
    }

    function showMsg(text) {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.showAlert(text);
      } else {
        alert(text);
      }
    }

    function sanitize(str) {
      if (!str) return '';
      return String(str).replace(/[<>\"']/g, '').trim().slice(0, 300);
    }

    function toggleAdmin() {
      document.getElementById('admin-panel').classList.toggle('hidden');
    }

    function checkAdminPass() {
      const pass = document.getElementById('admin-pass-input').value;
      if (pass === ADMIN_PASSWORD) {
        isAdminLoggedIn = true;
        document.getElementById('admin-auth').classList.add('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        loadBannerInputs();
        loadAdminOrders();
        renderProducts(products);
      } else {
        showMsg('Неверный пароль!');
      }
    }

    function switchAdminTab(tab) {
      const prodSec = document.getElementById('admin-products-section');
      const banSec = document.getElementById('admin-banner-section');
      const ordSec = document.getElementById('admin-orders-section');
      const prodBtn = document.getElementById('tab-prod-btn');
      const banBtn = document.getElementById('tab-ban-btn');
      const ordBtn = document.getElementById('tab-ord-btn');

      prodSec.classList.add('hidden');
      banSec.classList.add('hidden');
      ordSec.classList.add('hidden');
      prodBtn.style.background = 'transparent'; prodBtn.style.color = 'var(--tg-hint)';
      banBtn.style.background = 'transparent'; banBtn.style.color = 'var(--tg-hint)';
      ordBtn.style.background = 'transparent'; ordBtn.style.color = 'var(--tg-hint)';

      if (tab === 'products') {
        prodSec.classList.remove('hidden');
        prodBtn.style.background = 'var(--tg-button)'; prodBtn.style.color = 'var(--tg-button-text)';
      } else if (tab === 'banner') {
        banSec.classList.remove('hidden');
        banBtn.style.background = 'var(--tg-button)'; banBtn.style.color = 'var(--tg-button-text)';
        loadBannerInputs();
      } else {
        ordSec.classList.remove('hidden');
        ordBtn.style.background = 'var(--tg-button)'; ordBtn.style.color = 'var(--tg-button-text)';
        loadAdminOrders();
      }
    }

    function onCategorySelectChange() {
      const select = document.getElementById('admin-category-select');
      const customInput = document.getElementById('admin-category-custom');
      if (select.value === 'new') {
        customInput.classList.remove('hidden');
        customInput.focus();
      } else {
        customInput.classList.add('hidden');
      }
    }

    async function loadProducts() {
      const skeleton = document.getElementById('skeleton');
      const grid = document.getElementById('products-grid');
      skeleton.classList.remove('hidden');
      grid.innerHTML = '';

      const { data, error } = await db
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });

      skeleton.classList.add('hidden');

      if (error) {
        console.error(error);
        grid.innerHTML = `<div class="col-span-2 text-center py-10" style="color: var(--tg-hint);">Ошибка загрузки товаров</div>`;
        return;
      }

      products = data || [];
      extractCategories();
      loadBannerText();
      filterProducts();
    }

    function extractCategories() {
      const set = new Set(['Платья', 'Костюмы', 'Верхняя одежда', 'Аксессуары']);
      products.forEach(p => {
        if (p.category) set.add(p.category);
      });
      availableCategories = Array.from(set);
      updateCategorySelectOptions();
      renderCategoryButtons();
    }

    function updateCategorySelectOptions() {
      const select = document.getElementById('admin-category-select');
      let html = '';
      availableCategories.forEach(cat => {
        html += `<option value="${cat}">${cat}</option>`;
      });
      html += `<option value="new">+ Создать новую категорию</option>`;
      select.innerHTML = html;
    }

    function renderCategoryButtons() {
      const container = document.getElementById('categories-container');
      let html = `<button onclick="filterByCategory('Все')" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap" style="background: ${currentCategory === 'Все' ? 'var(--tg-button)' : 'var(--tg-secondary)'}; color: ${currentCategory === 'Все' ? 'var(--tg-button-text)' : 'var(--tg-hint)'};">Все</button>`;
      
      availableCategories.forEach(cat => {
        const isActive = (currentCategory === cat);
        html += `<button onclick="filterByCategory('${cat}')" class="cat-btn px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap" style="background: ${isActive ? 'var(--tg-button)' : 'var(--tg-secondary)'}; color: ${isActive ? 'var(--tg-button-text)' : 'var(--tg-hint)'};">${cat}</button>`;
      });
      container.innerHTML = html;
    }

    function filterByCategory(cat) {
      currentCategory = cat;
      renderCategoryButtons();
      filterProducts();
    }

    function filterProducts() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const filtered = products.filter(p => {
        const matchesSearch = (p.name || '').toLowerCase().includes(q);
        const pCat = p.category || 'Платья';
        const matchesCat = (currentCategory === 'Все' || pCat === currentCategory);
        return matchesSearch && matchesCat;
      });
      renderProducts(filtered);
    }

    function renderProducts(list) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      if (!list.length) {
        grid.innerHTML = `<div class="col-span-2 text-center py-10" style="color: var(--tg-hint);">Товары не найдены</div>`;
        return;
      }

      list.forEach(p => {
        const img = (p.images && p.images[0]) ? p.images[0] : 'https://picsum.photos/id/1011/400/400';
        const card = document.createElement('div');
        card.className = 'rounded-2xl overflow-hidden border flex flex-col justify-between';
        card.style.background = 'var(--tg-secondary)';
        card.style.borderColor = '#2a2a2a';

        let adminButtons = '';
        if (isAdminLoggedIn) {
          adminButtons = `
            <div class="px-3 pb-2 pt-1 flex gap-1.5 border-t" style="border-color: #3a3a3a;">
              <button onclick="startEdit('${p.id}')" class="flex-1 py-1.5 rounded-lg text-xs font-medium bg-blue-600 text-white">Ред.</button>
              <button onclick="deleteProduct('${p.id}')" class="flex-1 py-1.5 rounded-lg text-xs font-medium bg-red-600 text-white">Удалить</button>
            </div>
          `;
        }

        card.innerHTML = `
          <div>
            <div onclick="openSheet('${p.id}')" class="cursor-pointer">
              <img src="${img}" class="w-full aspect-square object-cover" loading="lazy" onerror="this.src='https://picsum.photos/id/1011/400/400'">
              <div class="p-3">
                <div class="text-[13px] font-normal mb-1 line-clamp-2" style="color: var(--tg-hint);">${p.name || ''}</div>
                <div class="text-[18px] font-bold mb-3">${p.price || 0} ₸</div>
              </div>
            </div>
          </div>
          <div>
            ${adminButtons}
            <div class="px-3 pb-3">
              <button onclick="openSheet('${p.id}')" class="btn-primary w-full py-2.5 text-sm flex items-center justify-center gap-2">
                <span>В корзину</span>
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Сохранение и загрузка текстов баннера через localStorage (надежно и без лишних таблиц)
    function loadBannerText() {
      const tag = localStorage.getItem('banner_tag') || 'Новая коллекция';
      const title = localStorage.getItem('banner_title') || 'Весна-Лето 2026';
      document.getElementById('banner-tag').innerText = tag;
      document.getElementById('banner-title').innerText = title;
    }

    function loadBannerInputs() {
      document.getElementById('admin-banner-tag').value = localStorage.getItem('banner_tag') || 'Новая коллекция';
      document.getElementById('admin-banner-title').value = localStorage.getItem('banner_title') || 'Весна-Лето 2026';
    }

    function saveBannerText() {
      const tag = sanitize(document.getElementById('admin-banner-tag').value);
      const title = sanitize(document.getElementById('admin-banner-title').value);
      localStorage.setItem('banner_tag', tag);
      localStorage.setItem('banner_title', title);
      loadBannerText();
      document.getElementById('banner-status').innerText = 'Текст успешно сохранен!';
      setTimeout(() => document.getElementById('banner-status').innerText = '', 2000);
    }

    function openSheet(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;

      const images = (p.images && p.images.length) ? p.images : ['https://picsum.photos/id/1011/400/400'];
      const sizes = (p.sizes && p.sizes.length) ? p.sizes : [];
      const colors = (p.colors && p.colors.length) ? p.colors : [];

      let imgGalleryHTML = `
        <div class="relative w-full aspect-[4/5] rounded-2xl overflow-hidden mb-3 bg-black">
          <img id="main-sheet-img" src="${images[0]}" class="w-full h-full object-cover">
        </div>
      `;

      if (images.length > 1) {
        imgGalleryHTML += `<div class="flex gap-2 mb-4 overflow-x-auto no-scrollbar">`;
        images.forEach((imgUrl) => {
          imgGalleryHTML += `<img src="${imgUrl}" onclick="document.getElementById('main-sheet-img').src='${imgUrl}'" class="w-16 h-16 rounded-xl object-cover cursor-pointer border border-[#3a3a3a]">`;
        });
        imgGalleryHTML += `</div>`;
      }

      let sizesHTML = sizes.length ? `
        <div class="mb-3">
          <div class="text-xs mb-1.5" style="color: var(--tg-hint);">Выберите размер:</div>
          <div id="selected-sizes" class="flex gap-2 flex-wrap">
            ${sizes.map((s, idx) => `<button onclick="selectAttr('size', '${s}')" class="size-btn px-3.5 py-2 rounded-xl text-xs font-semibold border ${idx === 0 ? 'border-orange-500 bg-orange-500/10 text-orange-400' : 'border-[#3a3a3a]'}" style="color: var(--tg-text);">${s}</button>`).join('')}
          </div>
        </div>
      ` : '';

      let colorsHTML = colors.length ? `
        <div class="mb-5">
          <div class="text-xs mb-1.5" style="color: var(--tg-hint);">Выберите цвет:</div>
          <div id="selected-colors" class="flex gap-2 flex-wrap">
            ${colors.map((c, idx) => `<button onclick="selectAttr('color', '${c}')" class="color-btn px-3.5 py-2 rounded-xl text-xs font-semibold border ${idx === 0 ? 'border-orange-500 bg-orange-500/10 text-orange-400' : 'border-[#3a3a3a]'}" style="color: var(--tg-text);">${c}</button>`).join('')}
          </div>
        </div>
      ` : '';

      document.getElementById('sheet-content').innerHTML = `
        ${imgGalleryHTML}
        <div class="text-[14px] mb-1" style="color: var(--tg-hint);">${p.name || ''}</div>
        <div class="text-[24px] font-bold mb-4">${p.price || 0} ₸</div>
        ${sizesHTML}
        ${colorsHTML}
        <button onclick="addToCartWithOptions('${p.id}')" class="btn-primary w-full py-3.5 text-base">Добавить в корзину</button>
      `;

      window.chosenSize = sizes.length ? sizes[0] : '—';
      window.chosenColor = colors.length ? colors[0] : '—';

      document.getElementById('sheet-overlay').classList.remove('hidden');
      document.getElementById('bottom-sheet').classList.add('open');
    }

    function selectAttr(type, val) {
      if (type === 'size') {
        window.chosenSize = val;
        document.querySelectorAll('.size-btn').forEach(b => {
          if (b.innerText === val) {
            b.style.borderColor = '#f97316';
            b.style.background = 'rgba(249, 115, 22, 0.1)';
            b.style.color = '#f97316';
          } else {
            b.style.borderColor = '#3a3a3a';
            b.style.background = 'transparent';
            b.style.color = 'var(--tg-text)';
          }
        });
      } else if (type === 'color') {
        window.chosenColor = val;
        document.querySelectorAll('.color-btn').forEach(b => {
          if (b.innerText === val) {
            b.style.borderColor = '#f97316';
            b.style.background = 'rgba(249, 115, 22, 0.1)';
            b.style.color = '#f97316';
          } else {
            b.style.borderColor = '#3a3a3a';
            b.style.background = 'transparent';
            b.style.color = 'var(--tg-text)';
          }
        });
      }
    }

    function closeSheet() {
      document.getElementById('bottom-sheet').classList.remove('open');
      setTimeout(() => document.getElementById('sheet-overlay').classList.add('hidden'), 300);
    }

    function addToCartWithOptions(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;

      cart.push({
        ...p,
        size: window.chosenSize,
        color: window.chosenColor
      });
      updateCartCount();
      closeSheet();
      showMsg('Товар добавлен в корзину!');
    }

    function updateCartCount() {
      document.getElementById('cart-count').innerText = cart.length;
    }

    function showCart() {
      const container = document.getElementById('cart-items');
      const checkoutForm = document.getElementById('checkout-form');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-10" style="color: var(--tg-hint);">Корзина пуста</div>`;
        checkoutForm.classList.add('hidden');
      } else {
        checkoutForm.classList.remove('hidden');
        let total = 0;
        cart.forEach((item, i) => {
          total += Number(item.price) || 0;
          const img = (item.images && item.images[0]) ? item.images[0] : 'https://picsum.photos/id/1011/64/64';
          const el = document.createElement('div');
          el.className = 'flex gap-3 items-center p-3 rounded-2xl';
          el.style.background = 'var(--tg-secondary)';
          el.innerHTML = `
            <img src="${img}" class="w-14 h-14 rounded-xl object-cover flex-shrink-0">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium truncate">${item.name || ''}</div>
              <div class="text-xs" style="color: var(--tg-hint);">Размер: ${item.size} | Цвет: ${item.color}</div>
              <div class="text-[15px] font-bold" style="color: var(--tg-button);">${item.price || 0} ₸</div>
            </div>
            <button onclick="removeFromCart(${i})" class="text-xl px-2" style="color: #ef4444;">×</button>
          `;
          container.appendChild(el);
        });
        document.getElementById('cart-total').innerText = total + ' ₸';
      }

      document.getElementById('cart-overlay').classList.remove('hidden');
      document.getElementById('cart-sheet').classList.add('open');
    }

    function hideCart() {
      document.getElementById('cart-sheet').classList.remove('open');
      setTimeout(() => document.getElementById('cart-overlay').classList.add('hidden'), 300);
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartCount();
      showCart();
    }

    async function checkout() {
        try {
          const tgResponse = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: message })
          });
          
          const tgResult = await tgResponse.json();
          
          if (!tgResponse.ok) {
            // Если Telegram отклонил сообщение, покажем точную ошибку на экране
            alert("Ошибка Telegram: " + JSON.stringify(tgResult));
          }
        } catch (err) {
          alert("Сетевая ошибка: " + err.message);
        }
      }

      const total = cart.reduce((s, i) => s + (Number(i.price) || 0), 0);

      const { error } = await db.from('orders').insert([{
        user_email: `${name} | ${phone}`,
        items: cart,
        total_amount: total,
        status: 'Новый ⏳'
      }]);

      if (error) {
        showMsg('Ошибка оформления. Попробуйте позже.');
        console.error(error);
        return;
      }

      let itemsList = cart.map((item, index) => `${index + 1}. ${item.name} (Размер: ${item.size}, Цвет: ${item.color}) — ${item.price} ₸`).join('\n');
      let message = `🔥 Новый заказ в Velutto Studio!\n\n` +
                    `👤 Имя: ${name}\n` +
                    `📞 Телефон: ${phone}\n\n` +
                    `📦 Товары:\n${itemsList}\n\n` +
                    `💰 Итого: ${total} ₸`;

      if (TELEGRAM_BOT_TOKEN) {
        try {
          await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: message })
          });
        } catch (err) {
          console.error(err);
        }
      }

      showMsg('Заказ успешно принят! Менеджер свяжется с вами.');
      cart = [];
      nameInput.value = '';
      phoneInput.value = '';
      updateCartCount();
      hideCart();
    }

    function writeToManager() {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.openTelegramLink('https://t.me/Azhar_Suleimenova');
      } else {
        window.open('https://t.me/Azhar_Suleimenova', '_blank');
      }
    }

    async function loadAdminOrders() {
      const container = document.getElementById('admin-orders-list');
      container.innerHTML = `<div class="text-xs text-center" style="color: var(--tg-hint);">Загрузка заказов...</div>`;

      const { data, error } = await db.from('orders').select('*').order('created_at', { ascending: false });
      if (error || !data.length) {
        container.innerHTML = `<div class="text-xs text-center" style="color: var(--tg-hint);">Нет заказов</div>`;
        return;
      }

      container.innerHTML = '';
      data.forEach(ord => {
        const el = document.createElement('div');
        el.className = 'p-3 rounded-xl border text-xs space-y-1.5';
        el.style.background = 'var(--tg-bg)';
        el.style.borderColor = '#3a3a3a';
        el.innerHTML = `
          <div class="flex justify-between font-bold">
            <span>Клиент: ${ord.user_email}</span>
            <span style="color: var(--tg-button);">${ord.total_amount} ₸</span>
          </div>
          <div style="color: var(--tg-hint);">Статус: <b>${ord.status || 'Новый'}</b></div>
          <div class="flex gap-2 pt-2">
            <button onclick="updateOrderStatus('${ord.id}', 'В работе 🛠')" class="px-2 py-1 bg-blue-600 text-white rounded">В работу</button>
            <button onclick="updateOrderStatus('${ord.id}', 'Выполнен ✅')" class="px-2 py-1 bg-green-600 text-white rounded">Выполнен</button>
          </div>
        `;
        container.appendChild(el);
      });
    }

    async function updateOrderStatus(id, newStatus) {
      await db.from('orders').update({ status: newStatus }).eq('id', id);
      showMsg('Статус обновлен!');
      loadAdminOrders();
    }

    function startEdit(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;

      document.getElementById('edit-product-id').value = p.id;
      document.getElementById('admin-name').value = p.name || '';
      document.getElementById('admin-price').value = p.price || '';
      
      const select = document.getElementById('admin-category-select');
      const customInput = document.getElementById('admin-category-custom');
      if (availableCategories.includes(p.category)) {
        select.value = p.category;
        customInput.classList.add('hidden');
      } else {
        select.value = 'new';
        customInput.value = p.category || '';
        customInput.classList.remove('hidden');
      }

      document.getElementById('admin-sizes').value = p.sizes ? p.sizes.join(', ') : '';
      document.getElementById('admin-colors').value = p.colors ? p.colors.join(', ') : '';
      
      document.getElementById('form-title').innerText = 'Редактировать товар';
      document.getElementById('save-btn').innerText = 'Сохранить изменения';
      document.getElementById('cancel-edit-btn').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('edit-product-id').value = '';
      document.getElementById('admin-name').value = '';
      document.getElementById('admin-price').value = '';
      document.getElementById('admin-category-select').value = availableCategories[0] || 'Платья';
      document.getElementById('admin-category-custom').classList.add('hidden');
      document.getElementById('admin-category-custom').value = '';
      document.getElementById('admin-sizes').value = '';
      document.getElementById('admin-colors').value = '';
      document.getElementById('admin-photos').value = '';
      
      document.getElementById('form-title').innerText = 'Добавить товар';
      document.getElementById('save-btn').innerText = 'Опубликовать товар';
      document.getElementById('cancel-edit-btn').classList.add('hidden');
      document.getElementById('admin-status').innerText = '';
    }

    async function deleteProduct(id) {
      if (!confirm('Удалить этот товар?')) return;
      await db.from('products').delete().eq('id', id);
      showMsg('Товар удален');
      loadProducts();
    }

    async function saveProduct() {
      const editId = document.getElementById('edit-product-id').value;
      const name = sanitize(document.getElementById('admin-name').value);
      const price = parseFloat(document.getElementById('admin-price').value);
      
      const selectVal = document.getElementById('admin-category-select').value;
      let category = selectVal;
      if (selectVal === 'new') {
        category = sanitize(document.getElementById('admin-category-custom').value);
      }

      const sizesStr = document.getElementById('admin-sizes').value;
      const colorsStr = document.getElementById('admin-colors').value;
      const fileInput = document.getElementById('admin-photos');
      const status = document.getElementById('admin-status');

      if (!name || !price || !category) {
        status.innerText = 'Заполните название, цену и категорию';
        return;
      }

      status.innerText = 'Загрузка фото и сохранение...';

      let imageUrls = [];
      if (fileInput.files.length > 0) {
        for (let i = 0; i < fileInput.files.length; i++) {
          const file = fileInput.files[i];
          const fileName = `${Date.now()}_${i}.${file.name.split('.').pop()}`;
          const { error: uploadError } = await db.storage.from('product-images').upload(fileName, file);
          if (!uploadError) {
            const { data: { publicUrl } } = db.storage.from('product-images').getPublicUrl(fileName);
            imageUrls.push(publicUrl);
          }
        }
      }

      const sizes = sizesStr ? sizesStr.split(',').map(s => s.trim()).filter(Boolean) : [];
      const colors = colorsStr ? colorsStr.split(',').map(c => c.trim()).filter(Boolean) : [];

      if (editId) {
        const updateData = { name, price, category, sizes, colors };
        if (imageUrls.length > 0) updateData.images = imageUrls;
        await db.from('products').update(updateData).eq('id', editId);
        status.innerText = 'Товар обновлен!';
      } else {
        await db.from('products').insert([{ name, price, category, images: imageUrls, sizes, colors }]);
        status.innerText = 'Товар добавлен!';
      }

      resetForm();
      loadProducts();
    }

    // Init
    loadProducts();
    updateCartCount();
  </script>
</body>
</html>
